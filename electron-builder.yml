appId: com.vince.nightshiftreport
productName: Night Shift Report
directories:
  output: release
files:
  - out/**/*
  - node_modules/@prisma/client/**/*
  - prisma/**/*
extraResources:
  - from: src/generated/prisma-client/query_engine-windows.dll.node
    to: prisma/query_engine-windows.dll.node
win:
  target:
    - portable
  artifactName: Night Shift Report Portable ${version}.${ext}
portable:
  artifactName: Night Shift Report Portable ${version}.${ext}
