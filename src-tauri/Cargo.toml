[package]
name = "night-shift-report"
version = "3.0.0"
description = "Print-first Windows night shift report application"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-single-instance = "2.4.4"
uuid = { version = "1.26.1", features = ["v4"] }

# Tuned for a small exe: the whole application ships as this one file.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
